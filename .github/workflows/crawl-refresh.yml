name: Crawl · refresh

# Mode ĐẮT NHẤT, và là job DUY NHẤT làm việc nặng:
#   metadata + mục lục + chương + NỘI DUNG chương.
#
# Đây cũng là job DUY NHẤT ghi vào bảng `novels` và DUY NHẤT rút việc khỏi
# `crawl_queue`. `discover`/`latest` chỉ GHI vào hàng đợi.
#
# RunPlanner lấy việc theo thứ tự: crawl_queue trước (novel chưa từng có dữ
# liệu), rồi tới novel cũ nhất theo novel_sources.last_crawled_at.
on:
  workflow_run:
  workflows:
    - Crawl · latest
  types:
    - completed

  schedule:
    # Mỗi tháng một lần, ngày 1 lúc 03:00 UTC.
    - cron: '0 3 1 * *'
  workflow_dispatch:
    inputs:
      source:
        description: 'Nguồn (bỏ trống = CRAWL_DEFAULT_SOURCE)'
        required: false
        type: string
      limit:
        description: 'Trần số novel cho lần chạy này'
        required: false
        # Đo được: một novel tốn 25s (11 chương) tới ~110s (chạm trần 50 chương
        # nội dung). 150 novel là khoảng vừa với ngân sách 300 phút bên dưới.
        # `--limit 1000` cũ là con số của thời refresh chỉ lấy metadata.
        default: '150'
        type: string
      force:
        description: 'Ghi lại bất kể content_hash (dùng sau khi sửa bug ghi)'
        required: false
        default: false
        type: boolean

concurrency:
  group: crawl-refresh
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    # Rộng hơn latest vì phải gọi API cho từng novel, có rate limit lịch sự.
    #
    # CRAWL_MAX_RUN_MINUTES bên dưới đặt THẤP HƠN con số này. Trần đó mới là thứ
    # kết thúc job: crawler tự dừng lấy việc mới, GHI phần đã lấy, rồi thoát mã
    # 0. Nếu để runner giết vì quá giờ thì ghi được đúng 0 dòng, vì adapter lấy
    # hết rồi importer mới ghi.
    timeout-minutes: 330
    defaults:
      run:
        working-directory: crawler

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: crawler/package-lock.json

      - name: Cài dependency
        run: npm ci

      - name: Build
        run: npm run build

      - name: Doctor (dừng workflow nếu hỏng)
        run: npm run doctor
        env:
          CRAWLER_DATABASE_URL: ${{ secrets.CRAWLER_DATABASE_URL }}

      - name: Crawl
        run: |
          set -o pipefail
          npm run crawl:refresh -- \
            ${SOURCE:+--source "$SOURCE"} \
            --limit "${LIMIT:-1000}" \
            ${FORCE:+--force} 2>&1 | tee crawl.log
        env:
          CRAWLER_DATABASE_URL: ${{ secrets.CRAWLER_DATABASE_URL }}
          CRAWLER_USER_AGENT: ${{ secrets.CRAWLER_USER_AGENT }}
          # Dừng lấy việc mới sau 300 phút, chừa 30 phút để ghi database và dọn
          # hàng đợi trước khi runner hết giờ ở phút 330.
          CRAWL_MAX_RUN_MINUTES: '300'
          SOURCE: ${{ inputs.source }}
          LIMIT: ${{ inputs.limit }}
          FORCE: ${{ inputs.force == true && '1' || '' }}

      - name: Lưu log khi hỏng
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: crawl-refresh-log-${{ github.run_id }}
          path: crawler/crawl.log
          retention-days: 14
